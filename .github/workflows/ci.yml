name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, type-check, test, eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and dev tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy
      - name: Pytest with coverage
        run: pytest --cov -q
      - name: Offline evaluation suite
        run: aegis-mcp eval --json

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: aegis-mcp:ci
      - name: Run container and probe health endpoints
        run: |
          docker run -d --name aegis-smoke -p 8000:8000 \
            -e AEGIS_ENVIRONMENT=production \
            -e AEGIS_TRANSPORT=streamable-http \
            -e AEGIS_AUTH_MODE=jwt \
            -e AEGIS_JWT_SECRET=ci-smoke-test-secret-at-least-32-chars \
            -e AEGIS_PUBLIC_URL=https://aegis.example.test \
            -e AEGIS_JWT_ISSUER=https://issuer.example.test \
            -e AEGIS_JWT_AUDIENCE=https://aegis.example.test \
            -e AEGIS_OFFLINE=true \
            aegis-mcp:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then ok=1; break; fi
            sleep 1
          done
          docker logs aegis-smoke
          test "${ok:-0}" = "1"
          curl -fsS http://127.0.0.1:8000/readyz
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/mcp)" = "401"
      - name: Container logs on failure
        if: failure()
        run: docker logs aegis-smoke || true

  security:
    name: Static security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip bandit
      - run: bandit -r src -q -c pyproject.toml
