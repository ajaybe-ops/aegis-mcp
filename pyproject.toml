[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aegis-mcp"
version = "0.1.0"
description = "Aegis MCP: a production-oriented MCP server for vulnerability intelligence and agentic incident triage."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aegis MCP maintainers" }]
keywords = ["mcp", "model-context-protocol", "security", "vulnerability", "incident-response", "ai-agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "mcp>=2.3,<3",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "PyJWT>=2.10,<3",
  "aiosqlite>=0.20,<1",
  "opentelemetry-api>=1.45,<2",
  "opentelemetry-sdk>=1.45,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
  "opentelemetry-instrumentation-httpx>=0.66b0",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=1.0",
  "pytest-cov>=6",
  "ruff>=0.9",
  "mypy>=1.14",
  "bandit>=1.8",
  "pip-audit>=2.8",
]

[project.scripts]
aegis-mcp = "aegis_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/ajaybe-ops/aegis-mcp"
Documentation = "https://github.com/ajaybe-ops/aegis-mcp/tree/main/docs"
Security = "https://github.com/ajaybe-ops/aegis-mcp/security/policy"
Issues = "https://github.com/ajaybe-ops/aegis-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_mcp"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "slow: tests that take more than a second",
  "network: tests that require outbound network access (skipped by default)",
]

[tool.coverage.run]
branch = true
source = ["aegis_mcp"]
omit = ["*/evals/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 75

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF"]
ignore = [
  "S101",  # asserts are intentional in tests
  "S105",  # test secrets are not production secrets
  "S106",
  "RUF001",  # ambiguity warnings for prose in docstrings
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
"src/aegis_mcp/evals/**" = ["S311"]
"examples/**" = ["S101", "T201"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unreachable = true
disallow_any_generics = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aiosqlite.*"]
ignore_missing_imports = true

# ASGI/HTTP instrumentation is loaded lazily and is optional by design, so the
# package must type-check when those extras are not installed.
[[tool.mypy.overrides]]
module = ["opentelemetry.instrumentation.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = [".venv", "tests", "src/aegis_mcp/evals"]
skips = ["B101"]
